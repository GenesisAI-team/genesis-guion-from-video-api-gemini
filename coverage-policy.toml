# Politica de cobertura estrategica por archivo (GEN-13 §6, GEN-18).
#
# Cada archivo medido debe coincidir con exactamente un patron. Si un archivo
# no coincide con ningun patron, el gate FALLA (fail-closed): nunca se asume
# una categoria por defecto.
#
# Los patrones se evaluan en orden; gana el primero que coincide.
# Las rutas son relativas a la raiz del repositorio y usan "/" como separador.

[thresholds]
core = 100.0
important = 80.0
infrastructure = 0.0

[files]
# CORE - 100 %: validación de tiempos y segmentos, duración real, referencias
# a material original y reglas críticas de selección.
"src/genesis_video_ai/editorial/segments.py" = "core"
"src/genesis_video_ai/editorial/sequence.py" = "core"
"src/genesis_video_ai/models/contracts.py" = "core"

# IMPORTANT - 80 %: procesamiento de vídeo (ffprobe), puerto Gemini y jobs
# con temporales de sesión.
"src/genesis_video_ai/analysis/ffprobe.py" = "important"
"src/genesis_video_ai/gemini/port.py" = "important"
"src/genesis_video_ai/jobs/tempfiles.py" = "important"

# INFRASTRUCTURE - sin mínimo: paquetes vacíos sin comportamiento.
"src/genesis_video_ai/__init__.py" = "infrastructure"
"src/genesis_video_ai/*/__init__.py" = "infrastructure"
"src/genesis_video_ai/gemini/errors.py" = "infrastructure"
